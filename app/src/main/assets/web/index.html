<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Couch">
<meta name="theme-color" content="#000000">
<title>Couch</title>
<style>
  :root {
    --bg: #000; --card: #1c1c1e; --card2: #2c2c2e; --line: #38383a;
    --text: #fff; --muted: #98989f; --faint: #636366;
    --accent: #f5c451; --blue: #0a84ff; --green: #30d158; --red: #ff453a;
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { padding: calc(var(--safe-t) + 8px) 0 calc(76px + var(--safe-b)); min-height: 100vh; }
  body.notabs { padding-bottom: 32px; }
  h1 { font-size: 30px; font-weight: 800; margin: 10px 16px 6px; letter-spacing: -0.5px; }
  h2 { font-size: 20px; font-weight: 700; margin: 22px 16px 10px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 24px 16px 8px; font-weight: 600; }
  p { margin: 6px 16px; color: var(--muted); }
  a { color: var(--blue); text-decoration: none; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--card2); border: 0; border-radius: 10px;
    padding: 12px 14px; width: 100%; outline: none; -webkit-appearance: none; appearance: none; }
  textarea { min-height: 76px; resize: vertical; }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  .wrap { padding: 0 16px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 18px; border-radius: 12px;
    background: var(--card2); font-weight: 600; font-size: 15px; }
  .btn.primary { background: var(--text); color: #000; }
  .btn.accent { background: var(--accent); color: #000; }
  .btn.small { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
  .btn.block { display: flex; width: 100%; }
  .btn:active { opacity: .7; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .hscroll { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 6px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
  .hscroll::-webkit-scrollbar { display: none; }
  .card { flex: 0 0 auto; width: 112px; text-align: left; scroll-snap-align: start; }
  .card .img { width: 100%; aspect-ratio: 2/3; border-radius: 10px; background: var(--card); overflow: hidden; position: relative;
    display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 12px; padding: 6px; text-align: center; }
  .card.wide { width: 220px; }
  .card.wide .img { aspect-ratio: 16/9; }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card .t { font-size: 13px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .s { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0,0,0,.55); }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .badge { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,.7); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px 12px; padding: 0 16px; }
  .grid .card { width: auto; }
  .seg { display: flex; background: var(--card); border-radius: 10px; padding: 3px; margin: 8px 16px; }
  .seg button { flex: 1; padding: 8px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--card2); color: var(--text); }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px 12px; }
  .filters select { padding: 10px 30px 10px 12px; font-size: 14px; }
  .list { background: var(--card); border-radius: 12px; margin: 0 16px; overflow: hidden; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
  .item:last-child { border-bottom: 0; }
  .item .grow { flex: 1; min-width: 0; }
  .item .sub { font-size: 12px; color: var(--muted); }
  .item .ttl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--faint); flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
  .on > .check, .check.on { background: var(--green); border-color: var(--green); }
  .on > .check::after, .check.on::after { content: ""; width: 6px; height: 11px; border: solid #000; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .banner { margin: 12px 16px; padding: 14px 16px; border-radius: 14px; background: linear-gradient(135deg, #3a2f12, #1c1c1e); }
  .banner b { display: block; margin-bottom: 4px; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--card2); border-top-color: var(--text); border-radius: 50%; animation: spin .8s linear infinite; margin: 40px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; color: var(--muted); padding: 40px 24px; }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: rgba(22,22,24,.86);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-top: 1px solid var(--line); padding-bottom: var(--safe-b); z-index: 10; }
  nav.tabs button { flex: 1; padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--faint); }
  nav.tabs button.on { color: var(--accent); }
  nav.tabs svg { width: 25px; height: 25px; }
  .sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; }
  .sheet.hidden { display: none; }
  .sheet .panel { background: #111113; width: 100%; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding-bottom: calc(24px + var(--safe-b)); position: relative; }
  .sheet .hero { position: relative; height: 210px; background: var(--card) center/cover no-repeat; }
  .sheet .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(17,17,19,0) 30%, #111113); }
  .sheet .close { position: absolute; top: 12px; right: 12px; z-index: 2; width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,.6); font-size: 18px; }
  .sheet h1 { margin-top: -40px; position: relative; z-index: 1; font-size: 26px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 16px; }
  .chip { background: var(--card2); border-radius: 6px; padding: 3px 8px; font-size: 12px; font-weight: 600; }
  .ep { display: flex; gap: 12px; padding: 10px 16px; align-items: center; width: 100%; text-align: left; }
  .ep .thumb { width: 120px; flex: 0 0 auto; aspect-ratio: 16/9; border-radius: 8px; background: var(--card) center/cover; position: relative; overflow: hidden; }
  .ep .ttl { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ep .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .ep .done { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,.7); border-radius: 10px; font-size: 11px; padding: 0 6px; }
  .np { margin: 10px 16px; border-radius: 16px; overflow: hidden; background: var(--card); }
  .np .art { height: 180px; background: var(--card2) center/cover; }
  .np .info { padding: 14px 16px; }
  .remote { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 16px; }
  .remote button { aspect-ratio: 1; border-radius: 50%; background: var(--card); font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .remote button.big { background: var(--text); color: #000; font-size: 22px; }
  input[type=range] { padding: 0; height: 28px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; background: var(--card2); border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff; margin-top: -8px; }
  .toast { position: fixed; left: 50%; bottom: calc(92px + var(--safe-b)); transform: translateX(-50%); background: #f2f2f7; color: #000; padding: 10px 16px;
    border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 30; max-width: 90vw; box-shadow: 0 6px 30px rgba(0,0,0,.4); opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .savebar { position: fixed; left: 0; right: 0; bottom: calc(60px + var(--safe-b)); padding: 10px 16px; background: linear-gradient(to top, #000 60%, rgba(0,0,0,0)); z-index: 5; }
  .toggle { width: 50px; height: 30px; border-radius: 15px; background: var(--card2); position: relative; flex: 0 0 auto; transition: background .2s; }
  .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: left .2s; }
  .toggle.on { background: var(--green); }
  .toggle.on::after { left: 22px; }
  .hint { font-size: 12px; color: var(--faint); margin-top: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs" style="display:none"></nav>
<div class="sheet hidden" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
// ---------------------------------------------------------------- basics
const qs = new URLSearchParams(location.search);
// Keep the token in the address too, so "Add to Home Screen" stays paired even if Safari clears its storage.
if (qs.get("t")) { try { localStorage.setItem("couchToken", qs.get("t")); } catch (e) {} }
let TOKEN = qs.get("t") || "";
try { TOKEN = TOKEN || localStorage.getItem("couchToken") || ""; } catch (e) {}

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const app = $("#app");
let state = null;
let tab = "home";
let pollTimer = null;
let renderToken = 0;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmt(ms) {
  ms = Math.max(0, ms || 0); let s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); s = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
}
let toastTimer = null;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}
async function api(path, body) {
  const opt = { headers: { "X-Couch-Token": TOKEN } };
  if (body !== undefined) { opt.method = "POST"; opt.headers["Content-Type"] = "application/json; charset=utf-8"; opt.body = JSON.stringify(body); }
  let r;
  try { r = await fetch(path, opt); } catch (e) { throw new Error("Can't reach the TV. Is Couch open and on the same Wi-Fi?"); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { const err = new Error(j.error || "Not paired"); err.unpaired = true; throw err; }
  if (!r.ok || j.error) throw new Error(j.error || ("Error " + r.status));
  return j;
}
function view(html) { app.innerHTML = html; window.scrollTo(0, 0); }
function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
function img(url) { return url ? `<img loading="lazy" src="${esc(url)}" onerror="this.remove()">` : ""; }

// ---------------------------------------------------------------- tabs
const ICONS = {
  home: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 2.5 11h2.7v9.3h5.3v-6h3v6h5.3V11h2.7z"/></svg>',
  browse: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7.5" height="7.5" rx="1.8"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.8"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.8"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.8"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>',
  remote: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 2h8a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3zm4 3.5a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM9.5 15a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zm5 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>',
};
const TAB_NAMES = { home: "Home", browse: "Browse", search: "Search", remote: "Remote", settings: "Settings" };
function renderTabs(show) {
  const n = $("#tabs");
  document.body.classList.toggle("notabs", !show);
  n.style.display = show ? "flex" : "none";
  if (!show) return;
  n.innerHTML = Object.keys(TAB_NAMES).map(k =>
    `<button data-tab="${k}" class="${tab === k || (tab === "filter" && k === "settings") ? "on" : ""}">${ICONS[k]}<span>${TAB_NAMES[k]}</span></button>`).join("");
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab); });

function setTab(t) { tab = t; render(); }
function render() {
  stopPoll(); renderToken++;
  renderTabs(true);
  ({ home: renderHome, browse: renderBrowse, search: renderSearch, remote: renderRemote, settings: renderSettings, filter: renderFilter }[tab] || renderHome)();
}

// ---------------------------------------------------------------- cards
function cardHtml(c, opts = {}) {
  const wide = opts.wide || c.wide;
  const prog = c.progress > 0 ? `<div class="bar"><i style="width:${Math.max(3, Math.min(100, c.progress * 100))}%"></i></div>` : "";
  const badge = c.quality === "4K" ? `<span class="badge">4K</span>` : "";
  const sub = c.subtitle || [c.year > 0 ? c.year : "", c.lang || ""].filter(Boolean).join(" · ");
  return `<button class="card ${wide ? "wide" : ""}" data-id="${esc(c.id)}" data-ep="${esc(c.episodeId || "")}" data-resume="${c.resume ? 1 : ""}">
    <div class="img">${esc(c.title)}${img(c.image || c.poster)}${badge}${prog}</div>
    <div class="t">${esc(c.title)}</div>${sub ? `<div class="s">${esc(sub)}</div>` : ""}</button>`;
}
app.addEventListener("click", e => {
  const c = e.target.closest(".card[data-id]");
  if (!c) return;
  if (c.dataset.resume) return play({ id: c.dataset.id, episodeId: c.dataset.ep || null });
  openItem(c.dataset.id);
});

async function play(body) {
  try {
    const r = await api("/api/play", body);
    toast(r.note || "Playing on your TV");
    closeSheet();
    if (r.delivered) setTab("remote");
  } catch (e) { toast(e.message); }
}

// ---------------------------------------------------------------- setup
function renderUnpaired() {
  renderTabs(false);
  view(`<h1>Couch</h1><p>This TV only lets paired phones in. Open Couch on the TV, go to Settings and scan the QR code with this phone's camera. Or switch off "Phones need the QR code" there.</p>`);
}
function renderSetup(changing) {
  renderTabs(!!changing); stopPoll();
  view(`<h1>${changing ? "Change login" : "Connect your IPTV"}</h1>
  <p>Type what your provider sent you. Your login is stored only on your TV.</p>
  <div class="wrap">
    <label>Server address (with port)</label>
    <input id="server" placeholder="http://example.com:8080" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url">
    <label>Username</label>
    <input id="username" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label>Password</label>
    <input id="password" type="password" autocapitalize="off" autocorrect="off">
    <label style="margin-top:22px">Or paste your M3U link instead</label>
    <textarea id="m3u" placeholder="http://host:port/get.php?username=…&password=…&type=m3u_plus" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
    <p class="hint" style="margin:6px 0 0">Plain M3U files without a username and password aren't supported yet. Nearly every provider uses the Xtream format above.</p>
    <div style="height:18px"></div>
    <button class="btn primary block" id="connect">Connect</button>
    <div id="err" class="small" style="color:var(--red);margin-top:12px"></div>
  </div>`);
  $("#connect").onclick = async () => {
    const b = $("#connect"); b.textContent = "Checking…"; b.disabled = true; $("#err").textContent = "";
    try {
      await api("/api/setup", { server: $("#server").value, username: $("#username").value, password: $("#password").value, m3u: $("#m3u").value });
      state = await api("/api/state");
      toast("Connected. Your TV is loading the library.");
      tab = "filter"; render();
    } catch (e) { $("#err").textContent = e.message; b.textContent = "Connect"; b.disabled = false; }
  };
}

// ---------------------------------------------------------------- home
function syncLine(s) {
  return `Loading library: ${esc(s.stage || "")}… ${s.movies.toLocaleString()} movies · ${s.series.toLocaleString()} series · ${s.live.toLocaleString()} channels`;
}
async function renderHome() {
  const my = renderToken;
  view(`<h1>Couch</h1><div id="banner"></div><div id="rows"><div class="spinner"></div></div>`);
  try {
    state = await api("/api/state");
    if (my !== renderToken) return;
    if (state.sync.running) {
      $("#banner").innerHTML = `<div class="banner"><b>Your TV is building the library</b><span class="small muted">${syncLine(state.sync)}</span></div>`;
      pollTimer = setInterval(async () => {
        try { state = await api("/api/state"); } catch (e) { return; }
        if (!state.sync.running) { render(); return; }
        const b = $("#banner .small"); if (b) b.innerHTML = syncLine(state.sync);
      }, 2000);
    } else if (!state.settings.filterChosen) {
      $("#banner").innerHTML = `<button class="banner" style="display:block;width:calc(100% - 32px);text-align:left" id="pickLangs">
        <b>Only want certain languages?</b><span class="small muted">Hide languages and categories you never watch. Tap to choose.</span></button>`;
      $("#pickLangs").onclick = () => setTab("filter");
    }
    const d = await api("/api/home");
    if (my !== renderToken) return;
    if (!d.rows.length) { $("#rows").innerHTML = `<div class="empty">Nothing here yet.</div>`; return; }
    $("#rows").innerHTML = d.rows.map(r =>
      `<h2>${esc(r.title)}</h2><div class="hscroll">${r.cards.map(c => cardHtml(c, { wide: r.wide })).join("")}</div>`).join("");
  } catch (e) { $("#rows").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

// ---------------------------------------------------------------- browse
const browse = { kind: "movie", cat: "", lang: "", decade: "", genre: "", sort: "Recent", items: [], more: false, options: {} };
async function renderBrowse() {
  const my = renderToken;
  const k = browse.kind;
  view(`<h1>Browse</h1>
    <div class="seg">${[["movie", "Movies"], ["series", "Series"], ["live", "Live TV"]].map(([v, l]) => `<button data-kind="${v}" class="${k === v ? "on" : ""}">${l}</button>`).join("")}</div>
    <div class="filters" id="filters"></div><div id="grid"><div class="spinner"></div></div>`);
  $$(".seg button").forEach(b => b.onclick = () => { browse.kind = b.dataset.kind; Object.assign(browse, { cat: "", lang: "", decade: "", genre: "", sort: "Recent" }); render(); });
  try {
    if (!browse.options[k]) browse.options[k] = await api("/api/options?kind=" + k);
    if (my !== renderToken) return;
    const o = browse.options[k];
    const sel = (id, label, opts, cur) => `<select id="${id}"><option value="">${label}</option>${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(cur) === String(v) ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
    let f = sel("f-cat", "All categories", o.categories.map(c => [c.id, c.name]), browse.cat);
    if (k !== "live") {
      f += sel("f-lang", "All languages", o.langs.map(l => [l, l]), browse.lang);
      f += sel("f-decade", "Any decade", o.decades.slice().reverse().map(d => [d, d + "s"]), browse.decade);
      f += sel("f-genre", "All genres", o.genres.map(g => [g, g]), browse.genre);
      f += `<select id="f-sort">${o.sorts.map(s => `<option value="${s.id}" ${browse.sort === s.id ? "selected" : ""}>${esc(s.label)}</option>`).join("")}</select>`;
    } else {
      f += sel("f-lang", "All languages", o.langs.map(l => [l, l]), browse.lang);
    }
    $("#filters").innerHTML = f;
    const bind = (id, key) => { const el = $("#" + id); if (el) el.onchange = () => { browse[key] = el.value; loadBrowse(true); }; };

function ratingChips(d) {
  const m = d.meta || {}; const out = [];
  if (m.imdbRating) out.push("IMDb " + m.imdbRating);
  if (m.rotten) out.push("Rotten Tomatoes " + m.rotten);
  if (m.metascore) out.push("Metacritic " + m.metascore);
  if (m.tmdbRating > 0) out.push("TMDB " + m.tmdbRating.toFixed(1));
  else if (d.item.rating > 0) out.push("★ " + d.item.rating.toFixed(1));
  return out.length ? `<div class="chips">${out.map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>` : "";
}

      <div class="list">${shown.map(c => {
        const key = flt.kind + ":" + c.id; const langOff = c.lang && flt.hiddenLangs.has(c.lang);
        return `<button class="item ${flt.hiddenCats.has(key) ? "" : "on"}" data-cat="${esc(key)}"><span class="check"></span><div class="grow"><div class="ttl">${esc(c.name)}</div><div class="sub">${c.count.toLocaleString()}${c.lang ? " · " + esc(c.lang) : ""}${langOff ? " · <span style='color:var(--red)'>language hidden</span>" : ""}</div></div></button>`;
      }).join("") || `<div class="item muted">No categories</div>`}</div>`;
  }
  html += `<div style="height:90px"></div>`;
  $("#flt").innerHTML = html;
  $$("[data-fk]").forEach(b => b.onclick = () => { flt.kind = b.dataset.fk; flt.q = ""; drawFilter(); });
  $$("[data-lang]").forEach(b => b.onclick = () => {
    const l = b.dataset.lang; if (flt.hiddenLangs.has(l)) flt.hiddenLangs.delete(l); else flt.hiddenLangs.add(l);
    flt.dirty = true; b.classList.toggle("on", !flt.hiddenLangs.has(l));
  });
  $$("[data-cat]").forEach(b => b.onclick = () => {
    const k = b.dataset.cat; if (flt.hiddenCats.has(k)) flt.hiddenCats.delete(k); else flt.hiddenCats.add(k);
    flt.dirty = true; b.classList.toggle("on", !flt.hiddenCats.has(k));
  });
  if ($("#allLangs")) $("#allLangs").onclick = () => { flt.hiddenLangs.clear(); flt.dirty = true; drawFilter(); };
  if ($("#onlyPref")) $("#onlyPref").onclick = () => { flt.hiddenLangs = new Set(d.langs.map(l => l.lang).filter(l => l !== pref && l !== "?")); flt.dirty = true; drawFilter(); };
  const fq = $("#fq");
  if (fq) fq.oninput = () => { flt.q = fq.value; const pos = fq.selectionStart; drawFilter(); const n = $("#fq"); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} };
  const bulk = hide => {
    const q = flt.q.trim().toLowerCase();
    (d.categories[flt.kind] || []).filter(c => !q || c.name.toLowerCase().includes(q)).forEach(c => {
      const key = flt.kind + ":" + c.id; if (hide) flt.hiddenCats.add(key); else flt.hiddenCats.delete(key);
    });
    flt.dirty = true; drawFilter();
  };
  if ($("#showAll")) $("#showAll").onclick = () => bulk(false);
  if ($("#hideAll")) $("#hideAll").onclick = () => bulk(true);
}
async function saveFilter() {
  const b = $("#saveFilter"); b.textContent = "Saving…";
  try {
    await api("/api/filter", { hiddenLangs: Array.from(flt.hiddenLangs), hiddenCats: Array.from(flt.hiddenCats) });
    flt.dirty = false; toast("Saved. Your TV library is updated.");
    tab = "home"; render();
  } catch (e) { toast(e.message); b.textContent = "Save"; }
}

// ---------------------------------------------------------------- boot
(async function boot() {
  try { state = await api("/api/state"); }
  catch (e) {
    if (e.unpaired) return renderUnpaired(); renderTabs(false); view(`<h1>Couch</h1><p>${esc(e.message)}</p><div class="wrap"><button class="btn block" onclick="location.reload()">Try again</button></div>`); return; }
  if (!state.configured) return renderSetup(false);
  render();
})();
</script>
</body>
