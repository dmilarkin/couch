name: Build Couch APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk couch.apk

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: couch-apk
          path: couch.apk

      # Publishes the APK at a stable link the TV's Downloader app can open:
      # https://github.com/<you>/<repo>/releases/download/latest/couch.apk
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Built from ${{ github.sha }}
          files: couch.apk
          make_latest: true
          
